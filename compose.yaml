services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duitku-app
    ports:
      - "8001:8000"
    volumes:
      - .:/var/www
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: duitku-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: expense_tracker
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: duitku
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: